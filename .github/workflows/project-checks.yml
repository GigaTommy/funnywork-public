name: Project checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev-windows.txt
      - run: python scripts/checks/check-repository.py
      - run: python scripts/checks/test_repository_hygiene.py
      - run: python scripts/checks/test_config_secrets.py
      - name: Source publication boundary checks
        if: runner.os == 'Linux'
        run: |
          python scripts/checks/test_public_source.py
          python scripts/checks/test_identity_package.py
          python scripts/checks/test_regional_configuration.py
          python scripts/checks/test-site-download-routing.py
      - run: python -m compileall -q funnyworker scripts
  management-and-business:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: apps/management/pnpm-lock.yaml
      - run: sh scripts/build-management.command
      - name: Identity security tests and runtime package
        run: >-
          sh scripts/mvn.sh -q -f services/identity/pom.xml -pl ruoyi-admin -am
          -DskipTests=false -Dtest=DirectorySyncTest,HttpDirectoryAdapterTest,ManagementCorsTest,ActuatorSecurityTest,RedisCodecSecurityTest
          -Dsurefire.failIfNoSpecifiedTests=false package
      - run: python scripts/checks/check-identity-package.py
      - name: Business integration tests
        run: >-
          sh scripts/mvn.sh -q
          -Dtest=AdminWebIntegrationTest,ManagementBindingsIntegrationTest,EmployeeAccountsIntegrationTest,ManagementIdentityIntegrationTest,LocalManagementBootstrapIntegrationTest,EmployeeChatsIntegrationTest,ControlIntegrationTest,OfficeDocumentsTest,OfficeToolsIntegrationTest,ModelProfilesIntegrationTest,WorkContextsIntegrationTest,MaintenanceAutomationIntegrationTest,ModelMiddlewareIntegrationTest,DesktopStartupControllerTest
          verify

  desktop-provider-groups:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Manufacturer grouping and deployment routing regression
        run: >-
          pnpm exec vitest run
          packages/llm/llm-pi-ai/tests/enterprise-runtime.spec.ts
          apps/desktop/tests/funnyworker-inference.spec.ts
          apps/desktop/tests/funnyworker-account.spec.ts
      - name: Text browser and desktop controls regression
        run: >-
          pnpm exec vitest run
          packages/bundle/funnywork-desktop-capabilities/tests
          packages/extensions/funnywork-desktop-controls/tests
          packages/experimental/browser-use-playwright-mcp/tests
          packages/computer-use/computer-use/tests
          packages/experimental/computer-use-cua-driver-native/tests
          packages/experimental/cua/tests
          packages/experimental/cua-macos/tests
          apps/desktop/tests/project-manager.spec.ts
          apps/desktop/tests/prepare-package-set.spec.ts
          apps/desktop/tests/funnyworker-account-login.spec.ts
          apps/desktop/tests/main-startup.spec.ts
          apps/desktop/tests/funnyworker-startup.spec.ts
          apps/desktop/tests/funnyworker-startup-http.spec.ts
          apps/desktop/tests/funnyworker-startup-timing.spec.ts
          scripts/primary-runtime/optimize.spec.ts
          scripts/primary-runtime/prepare.spec.ts
          apps/desktop/tests/primary-runtime-preparation.spec.ts
          packages/util/http-proxy/tests/funnywork.spec.ts
          packages/llm/llm-pi-ai/tests/enterprise-presets.spec.ts
          apps/desktop/tests/funnyworker-login.client.spec.tsx
      - name: Website interaction regressions
        working-directory: .
        run: node scripts/checks/check-site-interactions.cjs
