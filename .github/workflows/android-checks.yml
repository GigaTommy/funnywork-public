name: Android checks
on:
  pull_request:
    paths: ['apps/android/**', 'scripts/build/build-android*', '.github/workflows/android-checks.yml']
  push:
    paths: ['apps/android/**', 'scripts/build/build-android*', '.github/workflows/android-checks.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.local/agent/packages/gradle
      ANDROID_USER_HOME: ${{ github.workspace }}/.local/agent/packages/android-home
      ANDROID_AVD_HOME: ${{ github.workspace }}/.local/agent/apps/android-avd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build and verify
        run: sh scripts/build/build-android.sh assembleDebug testDebugUnitTest lintDebug assembleDebugAndroidTest
