services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fwruoyi
      POSTGRES_PASSWORD: ${FUNNYWORKER_LOCAL_DB_PASSWORD:?Run prepare-ruoyi.py}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:16432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fwruoyi -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${FUNNYWORKER_LOCAL_REDIS_PASSWORD:?Run prepare-ruoyi.py}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - redis-data:/data
volumes:
  postgres-data:
  redis-data:
