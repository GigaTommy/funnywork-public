name: FunnyWork
packages:
  iosMath:
    url: https://github.com/kostub/iosMath.git
    exactVersion: 2.5.0
  SwiftMarkdown:
    url: https://github.com/swiftlang/swift-markdown.git
    exactVersion: 0.9.0
  SwiftCMark:
    url: https://github.com/swiftlang/swift-cmark.git
    exactVersion: 0.9.0
options:
  bundleIdPrefix: com.funnyworker
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.1.0'
    APS_ENVIRONMENT: development
    FUNNYWORK_REGIONAL_ORIGIN: ''
    CURRENT_PROJECT_VERSION: '21'
    TARGETED_DEVICE_FAMILY: '1,2'
    FUNNYWORK_IOS_SIGNING_STYLE: Automatic
    FUNNYWORK_IOS_TEAM_ID: ''
    FUNNYWORK_IOS_PROFILE_NAME: ''
    FUNNYWORK_IOS_BUNDLE_IDENTIFIER: com.funnyworker.ios
  configs:
    Release:
      APS_ENVIRONMENT: production
targets:
  FunnyWork:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes: [Info.plist, FunnyWork.entitlements]
    dependencies:
      - package: iosMath
        product: iosMath
      - package: SwiftMarkdown
        product: Markdown
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: $(FUNNYWORK_IOS_BUNDLE_IDENTIFIER)
        CODE_SIGN_STYLE: $(FUNNYWORK_IOS_SIGNING_STYLE)
        DEVELOPMENT_TEAM: $(FUNNYWORK_IOS_TEAM_ID)
        PROVISIONING_PROFILE_SPECIFIER: $(FUNNYWORK_IOS_PROFILE_NAME)
        CODE_SIGN_ENTITLEMENTS: Sources/FunnyWork.entitlements
        INFOPLIST_FILE: Sources/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: FunnyWork
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 使用麦克风输入消息。
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 保存你选择的图片。
        INFOPLIST_KEY_NSCameraUsageDescription: 扫描二维码或拍摄照片。
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: 将语音转为文字，音频可能由 Apple 处理。
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  FunnyWorkTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: FunnyWork
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  FunnyWorkUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: FunnyWork
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  FunnyWork:
    build:
      targets:
        FunnyWork: all
    test:
      targets: [FunnyWorkTests, FunnyWorkUITests]
